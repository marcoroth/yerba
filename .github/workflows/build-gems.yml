name: Build Gems

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} gem
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: arm64-darwin, os: macos-latest }
          - { platform: x86_64-darwin, os: macos-13 }
          - { platform: aarch64-linux, os: ubuntu-latest }
          - { platform: x86_64-linux, os: ubuntu-latest }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cross-compile and package gem
        run: bundle exec rake cross_compile[${{ matrix.platform }}] gem[${{ matrix.platform }}]

      - name: Upload gem artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 7

  build-ruby:
    name: Build Ruby (fallback) gem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build fallback gem
        run: bundle exec rake gem:ruby

      - name: Upload gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 7

  push:
    name: Push gems with trusted publishing
    if: github.event_name == 'release' && github.repository_owner == 'marcoroth'
    needs: [build, build-ruby]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor release-gem patch
        uses: actions/checkout@v4
        with:
          repository: rubygems/release-gem
          ref: 1c162a739e8b4cb21a676e97b087e8268d8fc40b # v1.1.2
          path: .github/_release-gem

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download gem artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          path: pkg/
          merge-multiple: true

      - name: Configure trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Push gems with Sigstore attestation
        env:
          RUBYOPT: "-r${{ github.workspace }}/.github/_release-gem/rubygems-attestation-patch.rb"
        run: |
          cd pkg
          for gem_file in *.gem; do
            if [ -f "$gem_file" ]; then
              echo "Pushing $gem_file"
              gem push "$gem_file"
            fi
          done
