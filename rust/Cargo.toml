[package]
name = "yerba"
version = "0.8.0"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "YAML Editing and Refactoring with Better Accuracy"
readme = "README.md"
license = "MIT"
repository = "https://github.com/marcoroth/yerba"
keywords = ["yaml", "editing", "refactoring", "lossless", "cli"]
categories = ["parser-implementations", "development-tools"]

[lib]
name = "yerba"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "yerba"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:indoc", "dep:anstyle-query", "glob", "schema"]
glob = ["dep:glob", "dep:rayon"]
schema = ["dep:jsonschema"]

[dependencies]
yaml_parser = "0.3"
rowan = "0.16"
glob = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"], optional = true }
anstyle-query = { version = "1", optional = true }
indoc = { version = "2", optional = true }
rayon = { version = "1", optional = true }
jsonschema = { version = "0.29", default-features = false, optional = true }

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
indoc = "2"
tempfile = "3"
