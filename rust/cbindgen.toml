language = "C"
header = """/* Generated by cbindgen — do not edit manually */

#include <stdbool.h>
#include <stdint.h>
#include <stddef.h>"""
include_guard = "YERBA_H"
no_includes = true

[export]
include = [
  "NodeType",
  "YerbaValueType",
  "YerbaResult",
  "YerbaTypedValue",
  "YerbaTypedList",
  "YerbaGetResult",
]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"

[parse]
parse_deps = false
